<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piaoyao Battleboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f1e6d2' stroke='%23c8483b' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <h1>Piaoyao Battleboard</h1>
    <div id="turn" class="turn"></div>
    <div id="status" class="status"></div>
    <button id="ready" class="primary" type="button" hidden>Ready</button>
    <button id="reset" type="button">New match</button>
  </header>
  <main id="stage">
    <canvas id="board" aria-label="Battleboard"></canvas>
    <div id="setup" class="overlay" hidden>
      <div class="overlay-card setup-card">
        <h2 id="setup-title"></h2>
        <p>Pick up to 5 units. Repeats are allowed.</p>
        <ul id="unit-picker" class="picker"></ul>
        <div id="pick-total" class="pick-total"></div>
        <div class="actions">
          <button id="pick-default" type="button">One of each</button>
          <button id="pick-done" class="primary" type="button">Place units</button>
        </div>
      </div>
    </div>
    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <button id="play-again" type="button">Play again</button>
      </div>
    </div>
  </main>
  <footer id="legend" class="legend" aria-label="Unit types"></footer>
  <script src="js/units.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
